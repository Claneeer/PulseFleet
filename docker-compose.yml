# ==============================================================================
# PulseFleet (Marco 2) - Orquestracao de Persistencia Poliglota
# ==============================================================================
# Arquitetura de 2 camadas NoSQL com separacao estrita de responsabilidades:
#   1. Redis (Chave-Valor em memoria): estado instantaneo O(1) + ranking de
#      desvio termico via Sorted Set, com TTL automatico (24h).
#   2. ScyllaDB (Wide-Column compativel com Apache Cassandra / CQL): series
#      temporais imutaveis (append-only) baseadas em LSM-Tree para auditoria
#      regulatoria (ANVISA/FDA).
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Camada 1: Redis (Estado em Tempo Real e Fila de Alertas Termicos)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: pulsefleet-redis
    ports:
      - "6379:6379"
    # AOF habilitado para durabilidade leve; politica volatile-lru protege
    # o Sorted Set de alertas (sem TTL) e despeja apenas chaves com EXPIRE caso
    # o limite de memoria seja atingido.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis-data:/data
    networks:
      - pulsefleet-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Camada 2: ScyllaDB (Wide-Column / LSM-Tree compativel com CQL/Cassandra)
  # ----------------------------------------------------------------------------
  scylla:
    image: scylladb/scylla:5.4
    container_name: pulsefleet-scylla
    ports:
      - "9042:9042"
    # Parametros otimizados para ambiente local/demonstracao (laptops/Docker Desktop):
    #   --smp 1            : 1 core dedicado (arquitetura shard-per-core)
    #   --memory 750M      : limite de RAM amigavel para apresentacao ao vivo
    #   --overprovisioned 1: reduz busy-polling em ambientes virtualizados
    #   --developer-mode 1 : dispensa verificacao estrita de filesystem XFS/AIO
    command: >
      --smp 1
      --memory 750M
      --overprovisioned 1
      --developer-mode 1
      --api-address 0.0.0.0
    volumes:
      - scylla-data:/var/lib/scylla
      - ./init-scripts:/init-scripts:ro
    networks:
      - pulsefleet-net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Job de Inicializacao DDL (Aplica init-cassandra.cql assim que Scylla sobe)
  # ----------------------------------------------------------------------------
  scylla-init:
    image: scylladb/scylla:5.4
    container_name: pulsefleet-scylla-init
    depends_on:
      scylla:
        condition: service_healthy
    volumes:
      - ./init-scripts/init-cassandra.cql:/init-cassandra.cql:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo "[scylla-init] Aplicando DDL em pulsefleet..."
        cqlsh scylla 9042 -f /init-cassandra.cql
        echo "[scylla-init] Keyspace e tabela criados/verificados com sucesso!"
    networks:
      - pulsefleet-net
    restart: "no"

  # ----------------------------------------------------------------------------
  # API REST de Ingestao e Auditoria (FastAPI)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pulsefleet-api
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CASSANDRA_HOSTS: scylla
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: pulsefleet
      TEMP_MIN: "2.0"
      TEMP_MAX: "8.0"
      STATUS_TTL_SECONDS: "86400"
      DB_MAX_RETRIES: "20"
      DB_RETRY_DELAY_SECONDS: "3"
    depends_on:
      redis:
        condition: service_healthy
      scylla:
        condition: service_healthy
      scylla-init:
        condition: service_completed_successfully
    networks:
      - pulsefleet-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Simulador IoT Opcional (Ative com: docker compose --profile simulator up)
  # ----------------------------------------------------------------------------
  simulator:
    profiles: ["simulator"]
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pulsefleet-simulator
    command:
      - python
      - simulator.py
      - --url
      - http://app:8000
      - --vehicles
      - "25"
      - --interval
      - "1.5"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - pulsefleet-net
    restart: "no"

volumes:
  redis-data:
    driver: local
  scylla-data:
    driver: local

networks:
  pulsefleet-net:
    driver: bridge
